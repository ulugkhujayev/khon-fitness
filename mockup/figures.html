<!doctype html>
<html><head><meta charset="utf-8"><title>Figures</title>
<style>
  body { margin: 0; background: #000; color: #fff; font: 13px -apple-system, Inter, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; width: 1500px; }
  .card { background: #14532d; border-radius: 12px; padding: 8px; }
  .card h3 { margin: 0 0 4px; font-size: 14px; }
  .card p { margin: 0 0 6px; color: rgba(255,255,255,.7); font-size: 11px; min-height: 28px; }
  .row { display: flex; gap: 6px; }
  canvas { width: 170px; height: 170px; background: rgba(0,0,0,.15); border-radius: 8px; }
</style></head>
<body><div class="grid" id="grid"></div>
<script>
const params = new URLSearchParams(location.search);
fetch('figures.json?' + Date.now()).then(r => r.json()).then(data => {
  const grid = document.getElementById('grid');
  for (const key of Object.keys(data)) {
    if (key.startsWith('_')) continue;
    const f = data[key];
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = '<h3>' + key + '</h3><p>' + (f.cue || '') + '</p><div class="row"></div>';
    const row = card.querySelector('.row');
    // pose a, mid, pose b, and the right-side mirror of pose a
    [[f.a, 0], [f.a, 0.5], [f.b, 0], [f.a, 0, true]].forEach(([p, t, mirror]) => {
      const c = document.createElement('canvas'); c.width = 480; c.height = 480; row.appendChild(c);
      draw(c.getContext('2d'), t ? mix(f.a, f.b, t) : p, !!mirror);
    });
    grid.appendChild(card);
  }
});
function mix(a, b, t) { const o = {}; for (const k in a) o[k] = [a[k][0] + (b[k][0] - a[k][0]) * t, a[k][1] + (b[k][1] - a[k][1]) * t]; return o; }
function draw(g, p, mirror) {
  const S = 4.8; const X = v => (mirror ? 100 - v[0] : v[0]) * S, Y = v => v[1] * S;
  g.clearRect(0, 0, 480, 480);
  g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 12; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath();
  // spine as a curve through the chest
  g.moveTo(X(p.shoulder), Y(p.shoulder)); g.quadraticCurveTo(X(p.chest), Y(p.chest), X(p.hip), Y(p.hip));
  const seg = (a, b) => { g.moveTo(X(p[a]), Y(p[a])); g.lineTo(X(p[b]), Y(p[b])); };
  seg('hip', 'kneeB'); seg('kneeB', 'footB'); seg('shoulder', 'elbowB'); seg('elbowB', 'handB');
  g.stroke();
  // near limbs slightly brighter and on top
  g.beginPath(); g.strokeStyle = '#fff';
  seg('hip', 'kneeF'); seg('kneeF', 'footF'); seg('shoulder', 'elbowF'); seg('elbowF', 'handF');
  g.stroke();
  // neck: from the shoulder to the edge of the head circle
  { const dx = X(p.head) - X(p.shoulder), dy = Y(p.head) - Y(p.shoulder), d = Math.hypot(dx, dy) || 1; g.beginPath(); g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 12; g.moveTo(X(p.shoulder), Y(p.shoulder)); g.lineTo(X(p.head) - dx / d * 4.5 * S, Y(p.head) - dy / d * 4.5 * S); g.stroke(); }
  g.beginPath(); g.lineWidth = 12; g.arc(X(p.head), Y(p.head), 4.5 * S, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.lineWidth = 4; g.strokeStyle = 'rgba(255,255,255,.35)'; g.moveTo(6 * S, 86 * S); g.lineTo(94 * S, 86 * S); g.stroke();
}
</script></body></html>
